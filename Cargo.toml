[package]
name = "dadies"
version = "0.1.0"
edition = "2024"


[[bin]]
name = "dadies-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "dadies-server"
path = "src/bin/server.rs"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
atoi = "2.0.0"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
dashmap = "6.2.1"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.5"
